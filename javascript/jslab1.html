<!DOCTYPE html>
<html>
<head>
  <title>Lab 1 - Variables, Data Types & Operators</title>
</head>
<body>
  <h2>Lab 1: Variables, Data Types & Operators</h2>
  <script>
    // Variables and Data Types
    var name = "Alice";           // String
    var age = 20;                 // Number
    var gpa = 3.75;               // Float
    var isStudent = true;         // Boolean
    var course = null;            // Null

    document.write("<b>Name:</b> " + name + "<br>");
    document.write("<b>Age:</b> " + age + "<br>");
    document.write("<b>GPA:</b> " + gpa + "<br>");
    document.write("<b>Is Student:</b> " + isStudent + "<br>");
    document.write("<b>Course:</b> " + course + "<br><br>");

    // Arithmetic Operators
    var a = 10, b = 3;
    document.write("<b>Arithmetic Operators</b><br>");
    document.write("a + b = " + (a + b) + "<br>");
    document.write("a - b = " + (a - b) + "<br>");
    document.write("a * b = " + (a * b) + "<br>");
    document.write("a / b = " + (a / b) + "<br>");
    document.write("a % b = " + (a % b) + "<br><br>");

    // Comparison Operators
    document.write("<b>Comparison Operators</b><br>");
    document.write("a == b: " + (a == b) + "<br>");
    document.write("a != b: " + (a != b) + "<br>");
    document.write("a > b: "  + (a > b)  + "<br>");
    document.write("a < b: "  + (a < b)  + "<br>");
    document.write("a >= b: " + (a >= b) + "<br><br>");

    // Logical Operators
    document.write("<b>Logical Operators</b><br>");
    document.write("true && false: " + (true && false) + "<br>");
    document.write("true || false: " + (true || false) + "<br>");
    document.write("!true: "         + (!true)         + "<br>");
  </script>
</body>
</html>
