<!DOCTYPE html>
<html>
<head>
    <title>Variables and Data Types in JavaScript</title>
</head>
<body>

    <h2>JavaScript Variables and Data Types</h2>

    <script>
        // Variables
        var name = "Gaurab";          // String
        let age = 21;                 // Number
        const pi = 3.14;              // Number

        // Other Data Types
        let isStudent = true;         // Boolean
        let address;                  // Undefined
        let phone = null;             // Null

        let subjects = ["C", "Java", "PHP"];   // Array

        let student = {                // Object
            name: "Gaurab",
            age: 21
        };

        // Display values
        document.write("Name: " + name + "<br>");
        document.write("Age: " + age + "<br>");
        document.write("PI: " + pi + "<br>");
        document.write("Student: " + isStudent + "<br>");
        document.write("Address: " + address + "<br>");
        document.write("Phone: " + phone + "<br>");
        document.write("Subjects: " + subjects + "<br>");
        document.write("Student Object Name: " + student.name + "<br>");
        document.write("Student Object Age: " + student.age);
    </script>

</body>
</html>
