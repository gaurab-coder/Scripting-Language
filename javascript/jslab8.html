<!DOCTYPE html>
<html>
<head>
    <title>Lab 8 - Built-in Objects</title>
</head>
<body>
<h2>Built-in Objects</h2>

<script>
let s = "Hello JavaScript";
document.write("<b>String:</b> " + s + "<br>");
document.write("Length: " + s.length + "<br>");
document.write("Uppercase: " + s.toUpperCase() + "<br><br>");

document.write("<b>Math:</b><br>");
document.write("PI: " + Math.PI + "<br>");
document.write("Square Root: " + Math.sqrt(25) + "<br>");
document.write("Power: " + Math.pow(2,3) + "<br><br>");

let d = new Date();
document.write("<b>Date:</b> " + d.toDateString() + "<br>");
document.write("Year: " + d.getFullYear());
</script>

</body>
</html>
